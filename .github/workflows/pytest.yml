name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v1
      with:
        submodules: recursive
    - name: Checkout github repo
      uses: actions/checkout@v2
    - name: Checkout LFS objects
      run: git lfs checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        eval `ssh-agent -s`
        # ssh-add - <<< '${{ secrets.auxin_signalling_pathway }}'
        python -m pip install --upgrade pip
        python -m pip install -e .[test]
    - name: Test with pytest
      run: |
        python -m pip install -e .
        python -m pytest --cov --cov-config=.coveragerc -v --capture=no
    # - uses: codecov/codecov-action@v1
    #   with:
    # token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
    - name: Lint with flake8
      run: |
        python -m flake8 auxin_signalling_pathway/*.py tests/*.py scripts/*.py --config .flake8
    - name: Import sorting with isort
      run: |
        python -m isort --verbose --check-only --diff auxin_signalling_pathway tests setup.py
