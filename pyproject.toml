[build-system]
requires = [
         "setuptools>=61",
         "wheel",
         "setuptools_scm[toml]>=8.0",
]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "dirty-tag"
write_to = "auxin_signalling_models/_version.py"

[project]
requires-python = ">=3.10"
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }

name = "auxin_signalling_models"
description = "Post-process patch clamp recordings with the staircase protocol"
authors = [
            {name="Joseph Shuttleworth", email="joey.shuttleworth@nottingham.ac.uk"},
           ]

classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
]

dependencies = [
        'scipy>=1.7',
        'numpy>=1.21',
        'sympy>=1.10',
        'myokit>=1.38.0',
        'networkx>=3.4.2',
        'numba>=0.61.2',
        'numbalsoda @ git+https://git@github.com/NicholasWogan/numbalsoda@c9183b5bc75002bac5270339f0e0ca645f102b4d',
        "flake8-pyproject>=1.2.4"
]

[project.optional-dependencies]
test = [
          'pytest-cov>=2.10',     # For coverage checking
          'pytest>=4.6',          # For unit tests
          'flake8>=3',            # For code style checking
          'isort>=7.0.0',
          'codecov>=2.1.3',
          'matplotlib>=3.7.0',
          'seaborn>=0.13.0',
	        'pyvis>=0.3.2'
      ]

docs = [
	"sphinx>=8.0.0",
	"ruff>=0.14.7",
  "furo>=2025.9.25"
	]

[tools.setuptools.package-data]
include_package_data = true

[project.scripts]
auxin_signalling_models = "auxin_signalling_models.scripts.__main__:main"

[tool.setuptools.packages.find]
include = ["auxin_signalling_models", "auxin_signalling_models.*"]

[project.urls]
Homepage = "https://github.com/joeyshuttleworth/auxin_signalling_models"
Source = "https://github.com/joeyshuttleworth/auxin_signalling_models"

[tool.isort]
skip = ["docs", "build", ".venv", "auxin_signalling_models/_version.py"]

[tool.flake8]
ignore = ["E501"]
